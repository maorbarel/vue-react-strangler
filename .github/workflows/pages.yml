name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pages serves the repo under /<repo-name>/, so the shell is built with that base path.
      - run: pnpm --filter legacy-vue build
      - run: pnpm --filter shell-react exec vite build --base "/${{ github.event.repository.name }}/"
      - run: node scripts/assemble.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/shell-react/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
